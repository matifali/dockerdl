name: Build and push dockerdl images
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: dockerdl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/lib/node_modules/npm
          
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        run: |
          images=("base" "conda" "tf" "torch" "tf-torch" "tf-torch-conda")
          for image in "${images[@]}"; do
            dockerfile="${image}.Dockerfile"
            if [ "$image" == "base" ]; then
              tag="matifali/dockerdl-base:latest"
            else
              tag="matifali/dockerdl:${image}"
            fi
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file "${dockerfile}" \
              --tag "${tag}" \
              ${{ github.event_name != 'pull_request' && '--push' || '--load' }} \
              .
          done

      - name: Update Readme on dockerhub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: matifali/dockerdl
          short-description: ${{ github.event.repository.description }}
          readme-filepath: README.md
