name: Build and push dockerdl images
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly rebuild so unpinned pip packages stay current
    - cron: "0 3 * * 1"

concurrency:
  group: dockerdl-${{ github.ref }}
  # Never cancel a publish to main mid-way (push and schedule share the ref)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # PRs push to GHCR so later jobs can test against this PR's images
  REGISTRY_PREFIX: ${{ github.event_name == 'pull_request' && 'ghcr.io/' || '' }}
  # Per-PR base tag so concurrent PRs don't build children against each other's base
  BASE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'latest' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: "*.Dockerfile"
          failure-threshold: error

  # Each platform builds on its native runner and pushes by digest;
  # a merge job then stitches the digests into one multi-arch tag.
  build-base:
    needs: lint
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./base.Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY_PREFIX }}matifali/dockerdl-base,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-base.${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-base:
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-base.*
          merge-multiple: true
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # digests never contain spaces
          docker buildx imagetools create -t "${REGISTRY_PREFIX}matifali/dockerdl-base:${BASE_TAG}" \
            $(printf "${REGISTRY_PREFIX}matifali/dockerdl-base@sha256:%s " *)

  build-images:
    needs: merge-base
    strategy:
      fail-fast: false
      matrix:
        image: [tf, torch, tf-torch]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/lib/node_modules/npm
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_PREFIX }}matifali/dockerdl
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
            org.opencontainers.image.authors=${{ github.event.repository.owner.login }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY_PREFIX }}matifali/dockerdl-base:${{ env.BASE_TAG }}
          outputs: type=image,name=${{ env.REGISTRY_PREFIX }}matifali/dockerdl,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}.${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-images:
    needs: build-images
    # Publish every image whose two legs passed even if another image failed;
    # PRs only need the untagged per-arch pushes to prove the children build
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        image: [tf, torch, tf-torch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}.*
          merge-multiple: true
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_PREFIX }}matifali/dockerdl
          tags: |
            type=raw,value=${{ matrix.image }}
            type=raw,value=latest,enable=${{ matrix.image == 'tf-torch' && github.ref == 'refs/heads/main' }}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -- *
          [ "$#" -eq 2 ] || { echo "expected 2 digests, got $#: $*"; exit 1; }
          # shellcheck disable=SC2046  # tags and digests never contain spaces
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY_PREFIX}matifali/dockerdl@sha256:%s " *)
